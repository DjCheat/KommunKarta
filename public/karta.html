
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interaktiv karta över Sveriges kommuner med möjlighet att markera, spara och exportera kommunurval.">
    <title>Sverigekarta - Sveriges kommuner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Sveriges kommuner</h1> <!-- Lägg till en rubrik på sidan -->


    <!-- Tillståndshanterare -->
    <div class="state-manager">
        <div class="state-manager-header">
            <h2>Sparade urval</h2>
        </div>
        <div class="state-save-form">
            <input type="text" id="custom-state-name" placeholder="Namn på nytt urval..." maxlength="50">
            <button id="save-custom-btn" class="save-btn">Spara</button>
        </div>
        <div id="saved-states-list" class="saved-states-list">
            <!-- Dynamiskt genererad lista -->
        </div>
        <div class="state-manager-footer">
            <button id="load-all-states-btn" class="load-all-btn">Ladda alla urval</button>
        </div>
    </div>

    <div class="container"> <!-- Lägg till en container runt kartan och checkbox-listan -->
        <div class="map-and-export-wrapper">
            <div id="mapContainer" tabindex="0" role="application" aria-label="Interaktiv karta över Sveriges kommuner"> <!-- En behållare för att möjliggöra zoom och panorering -->
                <!-- Zoom controls in lower right corner -->
                <div class="zoom-controls">
                    <button id="zoom-in-btn" class="zoom-btn zoom-in" title="Zooma in" aria-label="Zooma in">+</button>
                    <button id="zoom-out-btn" class="zoom-btn zoom-out" title="Zooma ut" aria-label="Zooma ut">−</button>
                </div>
                
                <svg id="sweden-map" width="600" height="1200" role="img" aria-label="Karta över Sveriges kommuner">
                    <!-- SVG-innehåll laddas dynamiskt via JavaScript -->
                </svg>
            </div> <!-- Stäng div-taggen för mapContainer -->
            
            <!-- Export button centered below the map -->
            <div class="export-btn-container">
                <button id="export-btn" class="export-btn">Exportera som SVG</button>
            </div>
        </div>

        <div class="checkbox-and-controls-wrapper">
            <div id="checkbox-list" role="list" aria-label="Lista över Sveriges kommuner">
                <!-- Checkboxlistan genereras dynamiskt med JavaScript -->
            </div>
            
            <!-- Checkbox control buttons centered below the list -->
            <div class="checkbox-controls-container">
                <button id="check-all-btn">Markera alla</button>
                <button id="uncheck-all-btn">Avmarkera alla</button>
            </div>
        </div>
    </div> <!-- Stäng div-taggen för container -->

    <script src="karta.js"></script>
</body>
</html>
